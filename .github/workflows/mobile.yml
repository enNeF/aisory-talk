# Builds the Flutter app in mobile/ on GitHub's machines, so no local Android/iOS toolchain is needed.
# Push to GitHub (or use "Run workflow"), then download the APK from the run's Artifacts section.
name: Mobile app

on:
  workflow_dispatch:
  push:
    paths: ["index.html", "css/**", "js/**", "icons/**", "mobile/**", ".github/workflows/mobile.yml"]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up project
        shell: pwsh
        run: ./mobile/tool/setup.ps1
      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v6
        with:
          name: aisory-talk-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk

  # Compile check only: installing on an iPhone needs signing with an Apple Developer account.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up project
        shell: pwsh
        run: ./mobile/tool/setup.ps1
      - name: Build iOS app (unsigned)
        working-directory: mobile
        run: flutter build ios --debug --no-codesign
