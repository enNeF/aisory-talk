name: aisory_talk
description: AI-SORY TALK for Android and iOS - a Flutter shell around the AI-SORY TALK web app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 6.1.5 (the last stable release) no longer builds with current Android Gradle Plugin versions:
  # its Android module uses getDefaultProguardFile('proguard-android.txt'). 6.2.x fixes that.
  flutter_inappwebview: ^6.2.0-beta.3
  path_provider: ^2.1.4
  share_plus: ">=11.0.0 <14.0.0"

dev_dependencies:
  # analysis_options.yaml (generated by flutter create) includes its rules.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  # Filled by tool/sync_web.ps1 from the web app in the parent folder.
  assets:
    - assets/www/
    - assets/www/css/
    - assets/www/js/
    - assets/www/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/www/icons/icon-512.png
  remove_alpha_ios: true
